<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c">
<meta name="description" content="CyberIntel — Real-time cybersecurity news, CVE intelligence, CISA KEV tracking, and threat research.">
<title>CyberIntel — Cybersecurity Media & Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --font-sans:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --radius:10px; --radius-lg:16px;
  --tr:.2s cubic-bezier(.4,0,.2,1);
  --maxw:1320px;
  --accent:#22d3ee; --accent-2:#06b6d4;
  --danger:#ef4444; --warn:#f59e0b; --ok:#10b981;
}
html[data-theme="dark"]{
  --bg:#070b14; --bg-2:#0b1220; --bg-3:#111a2c;
  --surface:#0d1526; --surface-2:#111c30; --surface-hover:#16213a;
  --border:#1c2a44; --border-2:#243654;
  --text:#e7eefb; --text-2:#a7b3ca; --text-3:#6e7d99; --text-4:#475569;
  --overlay:rgba(3,7,15,.78);
  --glow:0 0 30px rgba(34,211,238,.12);
}
html[data-theme="light"]{
  --bg:#f6f8fc; --bg-2:#eef2f9; --bg-3:#e4eaf4;
  --surface:#fff; --surface-2:#f9fbfe; --surface-hover:#f0f4fa;
  --border:#dbe3ee; --border-2:#c5d0e0;
  --text:#0f1a2e; --text-2:#42506b; --text-3:#6c7a95; --text-4:#94a0b8;
  --overlay:rgba(15,26,46,.5);
  --glow:0 0 30px rgba(6,182,212,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-sans);background:var(--bg);color:var(--text);
  line-height:1.6;min-height:100vh;overflow-x:hidden;
  background-image:
    radial-gradient(circle at 12% -10%, rgba(34,211,238,.06), transparent 40%),
    radial-gradient(circle at 92% 4%, rgba(59,130,246,.05), transparent 45%);
  transition:background-color .3s,color .3s;
}
html[dir="rtl"] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
img{max-width:100%;display:block}
::selection{background:var(--accent);color:#04121a}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg-2)}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}

.container{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 16px}
.hidden{display:none !important}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}.wrap{flex-wrap:wrap}
.gap-1{gap:6px}.gap-2{gap:10px}.gap-3{gap:16px}
.mt-2{margin-top:8px}.mt-3{margin-top:16px}.mt-4{margin-top:24px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:16px}
.tiny{font-size:.72rem}.small{font-size:.82rem}
.mono{font-family:var(--font-mono)}
.text-2{color:var(--text-2)}.text-3{color:var(--text-3)}.text-4{color:var(--text-4)}
.text-accent{color:var(--accent)}.text-danger{color:var(--danger)}.text-ok{color:var(--ok)}

/* Header */
.site-header{
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:color-mix(in oklab, var(--bg) 80%, transparent);
  border-bottom:1px solid var(--border);
}
.header-row{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem}
.brand-mark{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#00121b;font-family:var(--font-mono);font-weight:700;font-size:.82rem;
  box-shadow:0 0 0 1px rgba(34,211,238,.35),0 0 22px rgba(34,211,238,.35);
}
.brand-name span{color:var(--accent)}
.main-nav{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;margin-inline-start:8px}
.main-nav::-webkit-scrollbar{display:none}
.nav-link{padding:7px 11px;border-radius:8px;font-size:.85rem;font-weight:500;color:var(--text-2);white-space:nowrap;transition:var(--tr)}
.nav-link:hover{background:var(--surface-hover);color:var(--text)}
.nav-link.active{background:color-mix(in oklab,var(--accent) 14%,transparent);color:var(--accent)}
.header-actions{display:flex;align-items:center;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--text-2);transition:var(--tr)}
.icon-btn:hover{background:var(--surface-hover);color:var(--accent)}
.icon-btn .badge{
  position:absolute;top:4px;inset-inline-end:4px;min-width:15px;height:15px;padding:0 3px;
  background:var(--danger);color:#fff;font-size:.62rem;font-weight:700;border-radius:8px;
  display:grid;place-items:center;
}

/* Breaking */
.breaking-bar{
  background:linear-gradient(90deg, rgba(239,68,68,.16), rgba(239,68,68,.04));
  border-bottom:1px solid rgba(239,68,68,.28);overflow:hidden;height:34px;display:flex;align-items:center;
}
.breaking-tag{
  display:flex;align-items:center;gap:6px;padding:0 12px;height:100%;
  background:var(--danger);color:#fff;font-size:.68rem;font-weight:800;
  letter-spacing:1px;text-transform:uppercase;flex-shrink:0;
}
.pulse-dot{width:6px;height:6px;background:#fff;border-radius:50%;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.ticker-track{display:flex;gap:28px;white-space:nowrap;animation:ticker 45s linear infinite;padding-inline-start:20px}
.breaking-bar:hover .ticker-track{animation-play-state:paused}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker-item{font-size:.82rem;color:var(--text);font-weight:500}
.ticker-item:hover{color:var(--accent)}

main.page{flex:1;padding:22px 0 50px;min-height:60vh}
.page-inner{min-height:50vh}

/* Cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.article-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  overflow:hidden;display:flex;flex-direction:column;transition:var(--tr);
}
.article-card:hover{transform:translateY(-2px);border-color:var(--accent-2);box-shadow:var(--glow)}
.card-media{height:150px;background-size:cover;background-position:center;background-color:var(--bg-3);position:relative}
.card-media::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg, transparent 40%, rgba(0,0,0,.35))}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;flex:1}
.card-cat{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:6px}
.card-title{font-size:.94rem;font-weight:600;line-height:1.35;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.article-card:hover .card-title{color:var(--accent)}
.card-excerpt{font-size:.78rem;color:var(--text-3);line-height:1.5;margin-bottom:10px;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;justify-content:space-between;align-items:center;font-size:.7rem;color:var(--text-4);border-top:1px solid var(--border);padding-top:8px}

/* Section */
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 14px;gap:16px}
.section-title{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:10px}
.section-title::before{content:'';width:4px;height:18px;background:var(--accent);border-radius:2px;box-shadow:0 0 12px var(--accent)}
.section-link{font-size:.8rem;color:var(--text-3);font-weight:500}
.section-link:hover{color:var(--accent)}

/* Hero */
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-bottom:26px}
.hero-primary{position:relative;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);min-height:380px;background:var(--surface);display:flex;flex-direction:column}
.hero-media{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.4;transition:opacity .3s}
.hero-primary:hover .hero-media{opacity:.55}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(3,7,15,.15), rgba(3,7,15,.94) 78%)}
.hero-content{position:relative;margin-top:auto;padding:22px;z-index:1}
.hero-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1.3px;margin-bottom:10px}
.hero-title{font-size:clamp(1.2rem,2.2vw,1.75rem);line-height:1.25;font-weight:700;color:#e7eefb;margin-bottom:10px}
.hero-title:hover{color:var(--accent)}
.hero-excerpt{font-size:.88rem;color:#b4c0d4;margin-bottom:12px}
.hero-meta{display:flex;flex-wrap:wrap;gap:12px;font-size:.75rem;color:#8296b3}
.hero-side{display:flex;flex-direction:column;gap:12px}
.side-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;flex:1;transition:var(--tr)}
.side-card:hover{border-color:var(--accent-2);transform:translateY(-1px)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:.68rem;font-weight:600;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.chip.accent{background:color-mix(in oklab,var(--accent) 14%,transparent);color:var(--accent);border-color:transparent}
.sev-crit{background:rgba(220,38,38,.16);color:#fca5a5;border-color:transparent}
.sev-high{background:rgba(249,115,22,.16);color:#fdba74;border-color:transparent}
.sev-med{background:rgba(234,179,8,.16);color:#fde047;border-color:transparent}
.sev-low{background:rgba(34,197,94,.16);color:#86efac;border-color:transparent}
.kev-badge{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;border-color:transparent;font-weight:700}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 14px;border-radius:9px;font-weight:600;font-size:.83rem;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  transition:var(--tr);white-space:nowrap;
}
.btn:hover{background:var(--surface-hover);border-color:var(--border-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#03121a;border-color:transparent}
.btn-primary:hover{background:var(--accent-2);box-shadow:0 0 24px rgba(34,211,238,.4)}
.btn-danger{background:var(--danger);color:#fff;border-color:transparent}
.btn-danger:hover{background:#dc2626}
.btn-sm{padding:5px 10px;font-size:.76rem}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:.78rem;font-weight:600;color:var(--text-2)}
.field input,.field textarea,.field select{padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--bg-2);color:var(--text);transition:var(--tr);width:100%}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.field textarea{min-height:80px;resize:vertical;font-family:inherit}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:.83rem}
.tbl th,.tbl td{padding:9px 11px;text-align:start;border-bottom:1px solid var(--border)}
.tbl th{font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;color:var(--text-3);background:var(--surface-2)}
.tbl tr:hover td{background:var(--surface-hover)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(6px);z-index:1000;display:grid;place-items:center;padding:16px;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:620px;max-height:88vh;overflow:auto;box-shadow:0 20px 48px -12px rgba(0,0,0,.6);animation:slideUp .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slideUp{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-head h3{font-size:1rem;font-weight:700}
.modal-body{padding:18px 20px}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface)}

/* Toast */
.toast-root{position:fixed;bottom:18px;inset-inline-end:18px;z-index:1100;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:calc(100vw - 36px)}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 14px;min-width:240px;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:flex;gap:10px;align-items:flex-start;pointer-events:auto;animation:slideIn .22s cubic-bezier(.2,.9,.3,1.2);border-inline-start:3px solid var(--accent)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.toast.err{border-inline-start-color:var(--danger)}
.toast.ok{border-inline-start-color:var(--ok)}
.toast.warn{border-inline-start-color:var(--warn)}
.toast-title{font-weight:600;font-size:.85rem}
.toast-msg{font-size:.75rem;color:var(--text-3);margin-top:2px}

/* Skeleton */
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-hover) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:shimmer 1.4s infinite;border-radius:var(--radius)}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.skeleton-card{height:250px;border-radius:var(--radius-lg)}
.skeleton-line{height:13px;margin-bottom:8px}

/* Empty */
.empty{text-align:center;padding:50px 18px;color:var(--text-3);border:1px dashed var(--border-2);border-radius:var(--radius-lg);background:var(--surface-2)}
.empty h3{font-size:1rem;color:var(--text);margin-bottom:6px}
.empty p{font-size:.85rem;margin-bottom:14px}
.empty-icon{width:50px;height:50px;border-radius:50%;background:var(--bg-3);display:grid;place-items:center;margin:0 auto 14px;color:var(--accent)}

/* Drawer */
.drawer-backdrop{position:fixed;inset:0;background:var(--overlay);z-index:99;display:none}
.drawer-backdrop.open{display:block;animation:fadeIn .2s}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:270px;background:var(--surface);border-inline-end:1px solid var(--border);z-index:100;padding:20px 14px;transform:translateX(-100%);transition:transform .26s;overflow-y:auto}
html[dir="rtl"] .drawer{transform:translateX(100%);border-inline-end:none;border-inline-start:1px solid var(--border)}
.drawer.open{transform:translateX(0) !important}
.drawer-link{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--text-2);font-size:.85rem;font-weight:500;margin-bottom:1px;transition:var(--tr)}
.drawer-link:hover{background:var(--surface-hover);color:var(--text)}
.drawer-link.active{background:color-mix(in oklab,var(--accent) 14%,transparent);color:var(--accent)}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;font-size:.83rem;font-weight:600;color:var(--text-3);border-bottom:2px solid transparent;transition:var(--tr);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);margin-bottom:16px}
.filters input[type=search], .filters select{padding:7px 11px;border-radius:8px;border:1px solid var(--border);background:var(--bg-2);color:var(--text);font-size:.83rem;min-width:0}
.filters input[type=search]{flex:1;min-width:160px}

/* Pager */
.pager{display:flex;justify-content:center;gap:5px;margin:26px 0 4px;flex-wrap:wrap}
.pager button{min-width:34px;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);font-size:.83rem;font-weight:600;color:var(--text-2)}
.pager button:hover:not(:disabled){border-color:var(--accent-2);color:var(--accent)}
.pager button.active{background:var(--accent);color:#03121a;border-color:transparent}
.pager button:disabled{opacity:.4;cursor:not-allowed}

/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat-card{padding:14px 16px;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;inset-inline-start:0;width:3px;height:100%;background:linear-gradient(var(--accent),var(--accent-2))}
.stat-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text-3);font-weight:600}
.stat-value{font-size:1.5rem;font-weight:700;margin:4px 0 2px;font-family:var(--font-mono)}
.stat-hint{font-size:.7rem;color:var(--text-4)}

/* Article page */
.article-title{font-size:clamp(1.4rem,3vw,2.1rem);line-height:1.2;font-weight:700;margin-bottom:12px;letter-spacing:-.3px}
.article-sub{font-size:.98rem;color:var(--text-2);margin-bottom:16px;max-width:76ch}
.article-byline{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--text-3);align-items:center;padding-bottom:16px;border-bottom:1px solid var(--border)}
.article-body{max-width:76ch;margin:22px auto 0;font-size:.98rem;line-height:1.75;color:var(--text)}
.article-body p{margin-bottom:1em}
.src-callout{max-width:76ch;margin:26px auto 16px;padding:12px 16px;border-radius:var(--radius);background:var(--surface-2);border:1px solid var(--border);font-size:.82rem;color:var(--text-2)}
.src-callout strong{color:var(--text)}

/* Live */
.live-wrap{position:relative;padding-inline-start:28px}
.live-wrap::before{content:'';position:absolute;inset-inline-start:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--accent),transparent)}
.live-item{position:relative;padding-bottom:22px}
.live-item::before{content:'';position:absolute;inset-inline-start:-27px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg),0 0 12px var(--accent)}
.live-time{font-family:var(--font-mono);font-size:.74rem;color:var(--accent);font-weight:600;margin-bottom:4px}
.live-text{font-size:.9rem;color:var(--text-2);line-height:1.6}

/* Comment */
.comment{padding:12px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);margin-bottom:8px}
.comment-head{display:flex;justify-content:space-between;margin-bottom:6px;font-size:.75rem;color:var(--text-3)}
.comment-head strong{color:var(--text-2)}
.comment-body{font-size:.85rem;color:var(--text-2);line-height:1.6;white-space:pre-wrap}
.comment-actions{display:flex;gap:12px;margin-top:8px;font-size:.72rem}
.comment-actions button{color:var(--text-3)}
.comment-actions button:hover{color:var(--accent)}
.comments{margin-top:36px;max-width:76ch;margin-inline:auto}
.comments h3{font-size:1rem;margin-bottom:14px}

/* Footer */
.site-footer{margin-top:50px;background:var(--bg-2);border-top:1px solid var(--border);padding:34px 0 20px}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px;margin-bottom:26px}
.footer-col h4{font-size:.78rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-3);margin-bottom:12px;font-weight:700}
.footer-col a{display:block;font-size:.8rem;color:var(--text-2);padding:3px 0}
.footer-col a:hover{color:var(--accent)}
.footer-bottom{border-top:1px solid var(--border);padding-top:16px;display:flex;justify-content:space-between;font-size:.75rem;color:var(--text-3);flex-wrap:wrap;gap:8px}

.health-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px}
.health-ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.health-err{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.health-warn{background:var(--warn)}

/* Status bar */
.status-bar{
  background:var(--surface-2);border-bottom:1px solid var(--border);

<script>
'use strict';
/* ============================================================================
   CyberIntel v2 — working single-file platform
   Fixes: DB module fully exported, dual CORS proxies, resilient init.
   ========================================================================= */
console.log('[CyberIntel] booting v2.1');

/* ---------- 1. CONFIG ---------- */
const CONFIG = {
  version: '2.1.0',
  dbName: 'cyberintel_v2',
  dbVersion: 1,
  pageSize: 12,
  proxies: [
    u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
    u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    u => 'https://thingproxy.freeboard.io/fetch/' + u
  ],
  nvdBase: 'https://services.nvd.nist.gov/rest/json/cves/2.0',
  kevUrl: 'https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json',
  defaultSources: [
    { name:'The Hacker News',   type:'rss', feedUrl:'https://feeds.feedburner.com/TheHackersNews', category:'news',     intervalMin:15 },
    { name:'BleepingComputer',  type:'rss', feedUrl:'https://www.bleepingcomputer.com/feed/',         category:'news',     intervalMin:15 },
    { name:'Krebs on Security', type:'rss', feedUrl:'https://krebsonsecurity.com/feed/',              category:'research', intervalMin:60 },
    { name:'CISA Advisories',   type:'rss', feedUrl:'https://www.cisa.gov/cybersecurity-advisories/all.xml', category:'advisory', intervalMin:60 },
    { name:'SANS ISC',          type:'rss', feedUrl:'https://isc.sans.edu/rssfeed.xml',               category:'research', intervalMin:60 },
    { name:'Project Zero',      type:'atom',feedUrl:'https://googleprojectzero.blogspot.com/feeds/posts/default', category:'research', intervalMin:360 },
    { name:'Schneier on Security', type:'atom', feedUrl:'https://www.schneier.com/feed/atom/',         category:'research', intervalMin:180 },
    { name:'Unit 42 (Palo Alto)',type:'rss', feedUrl:'https://unit42.paloaltonetworks.com/feed/',      category:'research', intervalMin:120 }
  ]
};

/* ---------- 2. UTILS ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const uid = () => 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => { if(!ts) return '—'; try { return new Date(ts).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); } catch { return '—'; } };
const fmtDateTime = ts => { if(!ts) return '—'; try { return new Date(ts).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'}); } catch { return '—'; } };
const relTime = ts => {
  if (!ts) return '—';
  const diff = (Date.now() - new Date(ts).getTime())/1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60)+'m ago';
  if (diff < 86400) return Math.floor(diff/3600)+'h ago';
  const d = Math.floor(diff/86400);
  if (d < 30) return d+'d ago';
  return fmtDate(ts);
};
const slugify = s => String(s||'').toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80) || uid();
const debounce = (fn, ms=280) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; };
const stripHtml = html => { const d = document.createElement('div'); d.innerHTML = html || ''; return (d.textContent||'').replace(/\s+/g,' ').trim(); };
const readingMinutes = t => Math.max(1, Math.round((t||'').split(/\s+/).length/220));
async function sha256(str){
  const buf = new TextEncoder().encode(str);
  if (!crypto.subtle) throw new Error('crypto.subtle unavailable — use https or localhost');
  const h = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function fetchTextWithProxy(url, timeoutMs=25000){
  let lastErr = null;
  for (let i=0; i<CONFIG.proxies.length; i++) {
    const proxied = CONFIG.proxies[i](url);
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(()=>ctrl.abort(), timeoutMs);
      const res = await fetch(proxied, { signal: ctrl.signal });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP '+res.status);
      const txt = await res.text();
      if (!txt || txt.length < 40) throw new Error('Empty response');
      return txt;
    } catch(e) {
      lastErr = e;
      console.warn(`[fetch] proxy #${i+1} failed for ${url}: ${e.message}`);
    }
  }
  throw new Error('All proxies failed: ' + (lastErr?.message || 'unknown'));
}

/* ---------- 3. TOAST / MODAL ---------- */
function toast(kind, title, msg, ms=4200){
  const root = $('#toastRoot');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind==='error'?'err':kind==='ok'?'ok':kind==='warn'?'warn':'');
  el.innerHTML = `<div style="flex:1"><div class="toast-title">${esc(title)}</div>${msg?`<div class="toast-msg">${esc(msg)}</div>`:''}</div>`;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(20px)'; setTimeout(()=>el.remove(),250); }, ms);
}
function openModal({title, body, footer, wide=false}){
  const root = $('#modalRoot');
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.innerHTML = `<div class="modal" ${wide?'style="max-width:900px"':''} role="dialog" aria-modal="true">
    <div class="modal-head"><h3>${esc(title||'')}</h3>
      <button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="modal-body">${body||''}</div>
    ${footer?`<div class="modal-foot">${footer}</div>`:''}
  </div>`;
  back.addEventListener('click', e => { if (e.target === back || e.target.closest('[data-close]')) close(); });
  function close(){ back.remove(); }
  root.appendChild(back);
  return { close, el: back };
}
function confirmDialog(msg, onYes){
  const m = openModal({ title: 'Confirm', body:`<p>${esc(msg)}</p>`,
    footer:`<button class="btn" data-close>Cancel</button><button class="btn btn-danger" id="cfmYes">Delete</button>` });
  m.el.querySelector('#cfmYes').addEventListener('click', () => { m.close(); onYes(); });
}

/* ---------- 4. INDEXEDDB — explicit object literal, all methods exported ---------- */
const DB = {
  _db: null,
  _stores: {
    articles:  { keyPath:'id', idx:[['slug','slug',{unique:true}],['canonicalUrl','canonicalUrl'],['contentHash','contentHash',{unique:true}],['status','status'],['publishedAt','publishedAt'],['category','category'],['sourceId','sourceId']] },
    cves:      { keyPath:'id', idx:[['cveId','cveId',{unique:true}],['severity','severity'],['kev','kev'],['publishedAt','publishedAt']] },
    incidents: { keyPath:'id', idx:[['status','status'],['country','country'],['publishedAt','publishedAt']] },
    sources:   { keyPath:'id', idx:[['feedUrl','feedUrl',{unique:true}],['status','status']] },
    syncLogs:  { keyPath:'id', idx:[['sourceId','sourceId'],['startedAt','startedAt']] },
    comments:  { keyPath:'id', idx:[['articleId','articleId'],['status','status'],['createdAt','createdAt']] },
    live:      { keyPath:'id', idx:[['startedAt','startedAt']] },
    audit:     { keyPath:'id', idx:[['action','action'],['createdAt','createdAt']] },
    analytics: { keyPath:'id', idx:[['type','type'],['ts','ts'],['target','target']] },
    meta:      { keyPath:'key' }
  },

  async init(){
    if (this._db) return this._db;
    return new Promise((resolve, reject) => {
      if (!indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
      const req = indexedDB.open(CONFIG.dbName, CONFIG.dbVersion);
      req.onupgradeneeded = () => {
        const db = req.result;
        for (const [name, cfg] of Object.entries(this._stores)) {
          if (!db.objectStoreNames.contains(name)) {
            const s = db.createObjectStore(name, { keyPath: cfg.keyPath });
            for (const [idxName, keyPath, opts] of cfg.idx) {
              try { s.createIndex(idxName, keyPath, opts||{}); } catch(e){ console.warn('index', idxName, e); }
            }
          }
        }
      };
      req.onsuccess = () => { this._db = req.result; resolve(this._db); };
      req.onerror = () => reject(req.error || new Error('IDB open failed'));
      req.onblocked = () => reject(new Error('IDB blocked by another tab'));
    });
  },

  async _store(name, mode='readonly'){
    const db = await this.init();
    return db.transaction(name, mode).objectStore(name);
  },

  _wrap(request){
    return new Promise((res, rej) => {
      request.onsuccess = () => res(request.result);
      request.onerror = () => rej(request.error);
    });
  },

  async put(store, val){
    if (!val.id && store !== 'meta') val.id = uid();
    const s = await this._store(store, 'readwrite');
    return this._wrap(s.put(val));
  },
  async get(store, key){
    const s = await this._store(store);
    return this._wrap(s.get(key));
  },
  async del(store, key){
    const s = await this._store(store, 'readwrite');
    return this._wrap(s.delete(key));
  },
  async all(store){
    const s = await this._store(store);
    return this._wrap(s.getAll());
  },
  async count(store){
    const s = await this._store(store);
    return this._wrap(s.count());
  },
  async clear(store){
    const s = await this._store(store, 'readwrite');
    return this._wrap(s.clear());
  },
  async byIndex(store, idx, val){
    const s = await this._store(store);
    return this._wrap(s.index(idx).getAll(val));
  },
  async getByIndex(store, idx, val){
    const s = await this._store(store);
    return this._wrap(s.index(idx).get(val));
  },
  async meta(key, val){
    if (val !== undefined) { await this.put('meta', { key, value: val }); return val; }
    const r = await this.get('meta', key);
    return r?.value;
  }
};

/* ---------- 5. STATE ---------- */
const State = {
  articles: [], cves: [], incidents: [], sources: [], comments: [], live: [],
  user: JSON.parse(localStorage.getItem('ci_user') || 'null')
};
function setUser(u){ State.user = u; if (u) localStorage.setItem('ci_user', JSON.stringify(u)); else localStorage.removeItem('ci_user'); }

/* ---------- 6. RBAC ---------- */
const PERMISSIONS = {
  SUPER_ADMIN:     ['*'],
  ADMIN:           ['article.*','source.*','comment.*','settings.*','analytics.view','audit.view'],
  EDITOR_IN_CHIEF: ['article.*','comment.*','analytics.view','source.view'],
  EDITOR:          ['article.create','article.edit','article.publish','article.review','comment.moderate','source.view'],
  REPORTER:        ['article.create','article.editOwn','source.view'],
  RESEARCHER:      ['article.create','article.editOwn'],
  MODERATOR:       ['comment.moderate','comment.delete']
};
function can(action){
  const u = State.user; if (!u) return false;
  const perms = PERMISSIONS[u.role] || [];
  if (perms.includes('*')) return true;
  return perms.some(p => p === action || (p.endsWith('.*') && action.startsWith(p.slice(0,-1))));
}

/* ---------- 7. AUDIT + ANALYTICS ---------- */
async function audit(action, resource, resourceId, details){
  try { await DB.put('audit', { id: uid(), action, resource, resourceId, userId: State.user?.email||'system', role: State.user?.role||'system', details: details||null, createdAt: Date.now() }); } catch(e){}
}
async function track(type, target, extra){
  try { await DB.put('analytics', { id: uid(), type, target: target||null, extra: extra||null, ts: Date.now() }); } catch(e){}
}

/* ---------- 8. CLASSIFIER ---------- */
const CLASSIFY_RULES = [
  { cat:'ransomware', patterns:[/ransomware/i,/lockbit/i,/blackcat/i,/alphv/i,/clop/i,/akira/i,/ransomhub/i,/medusa/i] },
  { cat:'vulnerability', patterns:[/CVE-\d{4}-\d{4,7}/i,/vulnerabilit/i,/zero.?day/i,/patch tuesday/i] },
  { cat:'data-breach', patterns:[/data breach/i,/breach/i,/leaked/i,/exposed records/i,/stolen data/i] },
  { cat:'malware', patterns:[/malware/i,/trojan/i,/stealer/i,/\brat\b/i,/backdoor/i,/rootkit/i,/botnet/i] },
  { cat:'phishing', patterns:[/phishing/i,/smishing/i,/vishing/i,/credential harvest/i] },
  { cat:'cloud-security', patterns:[/\bAWS\b/,/\bAzure\b/,/\bGCP\b/i,/cloud security/i,/kubernetes/i] },
  { cat:'ai-security', patterns:[/\bAI\b/,/LLM/i,/GPT/i,/prompt injection/i,/deepfake/i] },
  { cat:'ics-ot', patterns:[/\bICS\b/,/\bOT\b/,/SCADA/i,/\bPLC\b/] },
  { cat:'mobile', patterns:[/android/i,/iOS/i,/mobile security/i] },
  { cat:'network', patterns:[/router/i,/firewall/i,/\bVPN\b/i,/DNS/i,/BGP/i] },
  { cat:'government', patterns:[/CISA/,/NSA/,/FBI/,/government/i,/nation.?state/i,/APT\d+/i] },
  { cat:'advisory', patterns:[/advisory/i,/security update/i,/security bulletin/i,/patch released/i] },
  { cat:'research', patterns:[/research/i,/analysis/i,/whitepaper/i,/technical report/i] }
];
function classify(text){
  const hits = [];
  for (const rule of CLASSIFY_RULES) if (rule.patterns.some(p => p.test(text))) hits.push(rule.cat);
  const cves = Array.from(text.matchAll(/CVE-\d{4}-\d{4,7}/gi)).map(m => m[0].toUpperCase());
  return { category: hits[0] || 'news', tags: Array.from(new Set([...hits, ...cves])) };
}

/* ---------- 9. FEED PARSER ---------- */
function parseFeed(xml){
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const err = doc.querySelector('parsererror');
  if (err) throw new Error('XML parse error: ' + (err.textContent||'').slice(0,120));
  const items = [];
  const rssItems = doc.querySelectorAll('item');
  if (rssItems.length) {
    rssItems.forEach(item => items.push({
      title: (item.querySelector('title')?.textContent||'').trim(),
      link: (item.querySelector('link')?.textContent||'').trim(),
      guid: (item.querySelector('guid')?.textContent||'').trim(),
      description: item.querySelector('description')?.textContent || '',
      content: item.getElementsByTagName('content:encoded')[0]?.textContent || '',
      pubDate: item.querySelector('pubDate')?.textContent || '',
      creator: (item.getElementsByTagName('dc:creator')[0]?.textContent||''),
      image: item.querySelector('enclosure')?.getAttribute('url') || ''
    }));
  } else {
    doc.querySelectorAll('entry').forEach(item => {
      const linkEl = item.querySelector('link[rel="alternate"]') || item.querySelector('link');
      const link = linkEl?.getAttribute('href') || '';
      items.push({
        title: (item.querySelector('title')?.textContent||'').trim(),
        link, guid: item.querySelector('id')?.textContent || link,
        description: item.querySelector('summary')?.textContent || '',
        content: item.querySelector('content')?.textContent || '',
        pubDate: item.querySelector('published')?.textContent || item.querySelector('updated')?.textContent || '',
        creator: item.querySelector('author > name')?.textContent || '',
        image: ''
      });
    });
  }
  return items;
}

/* ---------- 10. PIPELINE ---------- */
let PIPELINE_RUNNING = false;
async function runPipeline(sourceId, onProgress){
  if (PIPELINE_RUNNING) { toast('warn','Pipeline running','Please wait.'); return { ok:false }; }
  PIPELINE_RUNNING = true;
  setStatus('Ingesting…');
  let totalNew = 0, totalDup = 0, totalFetched = 0, errors = 0;
  try {
    let sources;
    if (sourceId) {
      const s = await DB.get('sources', sourceId);
      sources = s ? [s] : [];
    } else {
      sources = (await DB.all('sources')).filter(s => s.status === 'active');
    }
    if (!sources.length) { toast('warn','No sources','Seed sources first.'); return { ok:false }; }

    for (const src of sources) {
      const log = { id: uid(), sourceId: src.id, sourceName: src.name, startedAt: Date.now(), fetched:0, newItems:0, duplicates:0, ok:false, error:null };
      try {
        onProgress?.(`Fetching ${src.name}…`);
        const xml = await fetchTextWithProxy(src.feedUrl);
        const items = parseFeed(xml);
        log.fetched = items.length; totalFetched += items.length;

        for (const item of items.slice(0, 40)) {
          if (!item.title || !item.link) continue;
          let hash;
          try { hash = await sha256(item.link + '|' + item.title); }
          catch(e){ hash = item.link.replace(/[^a-z0-9]/gi,'').slice(0,64); }

          const dupHash = await DB.getByIndex('articles','contentHash', hash);
          const dupUrl  = await DB.getByIndex('articles','canonicalUrl', item.link);
          if (dupHash || dupUrl) { log.duplicates++; totalDup++; continue; }

          const pubDate = item.pubDate ? (new Date(item.pubDate).getTime() || Date.now()) : Date.now();
          const text = item.title + '\n' + stripHtml(item.description || item.content || '');
          const cls = classify(text);
          const excerpt = stripHtml(item.description || item.content || '').slice(0, 320);

          const article = {
            id: uid(),
            slug: slugify(item.title) + '-' + hash.slice(0,6),
            title: item.title.slice(0,220),
            excerpt,
            body: null,
            heroImage: item.image || '',
            status: 'published',
            isBreaking: false,
            category: cls.category,
            tags: cls.tags,
            authorName: item.creator || src.name,
            sourceId: src.id,
            sourceName: src.name,
            originalUrl: item.link,
            canonicalUrl: item.link,
            contentHash: hash,
            sourcePublishedAt: pubDate,
            publishedAt: pubDate,
            importedAt: Date.now(),
            views: 0,
            readingMinutes: readingMinutes(excerpt),
            createdAt: Date.now(), updatedAt: Date.now()
          };
          await DB.put('articles', article);
          log.newItems++; totalNew++;
        }
        log.ok = true;
        await DB.put('sources', { ...src,
          lastSync: Date.now(), lastError: null, status: 'active',
          itemsFetched: (src.itemsFetched||0) + log.fetched,
          itemsPublished: (src.itemsPublished||0) + log.newItems,
          duplicates: (src.duplicates||0) + log.duplicates
        });
      } catch (err) {
        log.error = err.message || String(err);
        errors++;
        await DB.put('sources', { ...src, lastError: log.error, lastErrorAt: Date.now(), status: 'error' });
      }
      log.finishedAt = Date.now();
      await DB.put('syncLogs', log);
    }
    await audit('pipeline.run','sources', sourceId||'all', { totalNew, totalDup, totalFetched, errors });
    const msg = `${totalNew} new · ${totalDup} dup · ${totalFetched} fetched`;
    if (errors && !totalNew) toast('error','Ingestion failed', `${errors} source(s) errored`);
    else toast(errors?'warn':'ok','Ingestion complete', msg);
    setStatus('Ready');
    return { ok:true, totalNew, totalDup, totalFetched, errors };
  } finally {
    PIPELINE_RUNNING = false;
  }
}

/* ---------- 11. KEV ---------- */
async function syncKev(){
  setStatus('Loading CISA KEV…');
  try {
    const res = await fetch(CONFIG.kevUrl, { signal: AbortSignal.timeout(25000) });
    if (!res.ok) throw new Error('KEV HTTP ' + res.status);
    const data = await res.json();
    const vulns = data.vulnerabilities || [];
    let created = 0, updated = 0;
    for (const v of vulns) {
      const id = 'kev_' + v.cveID;
      const existing = await DB.get('cves', id);
      const rec = {
        id, cveId: v.cveID,
        description: v.shortDescription || '',
        vendor: v.vendorProject || '',
        product: v.product || '',
        publishedAt: v.dateAdded ? new Date(v.dateAdded).getTime() : Date.now(),
        kev: true,
        kevAddedAt: v.dateAdded ? new Date(v.dateAdded).getTime() : null,
        kevDueDate: v.dueDate ? new Date(v.dueDate).getTime() : null,
        kevNotes: v.notes || '',
        kevRequiredAction: v.requiredAction || '',
        kevName: v.vulnerabilityName || '',
        references: ['https://www.cisa.gov/known-exploited-vulnerabilities-catalog'],
        severity: null, cvssScore: null,
        updatedAt: Date.now(), createdAt: existing?.createdAt || Date.now()
      };
      await DB.put('cves', rec);
      existing ? updated++ : created++;
    }
    await DB.meta('kevLastSync', Date.now());
    setStatus('Ready');
    toast('ok','CISA KEV loaded', `${created} new · ${updated} updated · ${vulns.length} total`);
    await audit('kev.sync','cve','all',{created,updated,total:vulns.length});
    return { created, updated, total: vulns.length };
  } catch (err) {
    setStatus('Error');
    toast('error','KEV sync failed', err.message);
    throw err;
  }
}

/* ---------- 12. NVD ---------- */
async function fetchCveFromNvd(cveId){
  const url = CONFIG.nvdBase + '?cveId=' + encodeURIComponent(cveId);
  const res = await fetch(url, { signal: AbortSignal.timeout(25000) });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('NVD HTTP ' + res.status);
  const json = await res.json();
  const item = json.vulnerabilities?.[0];
  if (!item) return null;
  const c = item.cve;
  const desc = (c.descriptions || []).find(d => d.lang === 'en')?.value || '';
  const metrics = c.metrics || {};
  const cvss = metrics.cvssMetricV31?.[0] || metrics.cvssMetricV30?.[0] || metrics.cvssMetricV2?.[0];
  const score = cvss?.cvssData?.baseScore ?? null;
  const severity = cvss?.cvssData?.baseSeverity || (score >= 9 ? 'CRITICAL' : score >= 7 ? 'HIGH' : score >= 4 ? 'MEDIUM' : score ? 'LOW' : null);
  const weaknesses = c.weaknesses?.[0]?.description?.[0]?.value || null;
  return {
    id: 'cve_' + c.id, cveId: c.id, description: desc,
    publishedAt: c.published ? new Date(c.published).getTime() : null,
    modifiedAt: c.lastModified ? new Date(c.lastModified).getTime() : null,
    cvssScore: score, severity,
    cwe: weaknesses,
    references: (c.references||[]).map(r => r.url).slice(0,20),
    vendor: null, product: null, kev: false,
    createdAt: Date.now(), updatedAt: Date.now()
  };
}
async function loadCve(cveId){
  const id = 'cve_' + cveId;
  const kevRec = await DB.get('cves', 'kev_' + cveId);
  try {
    const nvdRec = await fetchCveFromNvd(cveId);
    if (nvdRec) {
      if (kevRec) {
        nvdRec.kev = true; nvdRec.kevAddedAt = kevRec.kevAddedAt;
        nvdRec.kevDueDate = kevRec.kevDueDate; nvdRec.kevNotes = kevRec.kevNotes;
        nvdRec.kevName = kevRec.kevName;
        if (!nvdRec.vendor) nvdRec.vendor = kevRec.vendor;
        if (!nvdRec.product) nvdRec.product = kevRec.product;
      }
      nvdRec.id = id;
      await DB.put('cves', nvdRec);
      return nvdRec;
    }
  } catch(e){ console.warn('NVD fetch failed:', e.message); }
  let local = await DB.get('cves', id);
  if (local) return local;
  if (kevRec) { kevRec.id = id; await DB.put('cves', kevRec); return kevRec; }
  return null;
}

  const path = hash.replace(/^#/, '').split('?')[0] || '/';
  for (const r of routes) {
    const m = r.pattern(path);
    if (m) return { handler: r.handler, params: m === true ? {} : m };

  return null;
}

function pagination({page, totalPages}){
  if (totalPages <= 1) return '';
  const out = [];
  out.push(`<button data-page="${page-1}" ${page<=1?'disabled':''}>‹</button>`);
  const start = Math.max(1, page-2), end = Math.min(totalPages, page+2);
  if (start>1) out.push(`<button data-page="1">1</button>`);
  if (start>2) out.push(`<span style="padding:0 6px;color:var(--text-3)">…</span>`);
  for (let i=start;i<=end;i++) out.push(`<button data-page="${i}" ${i===page?'class="active"':''}>${i}</button>`);
  if (end<totalPages-1) out.push(`<span style="padding:0 6px;color:var(--text-3)">…</span>`);
  if (end<totalPages) out.push(`<button data-page="${totalPages}">${totalPages}</button>`);
  out.push(`<button data-page="${page+1}" ${page>=totalPages?'disabled':''}>›</button>`);
  return `<div class="pager">${out.join('')}</div>`;
}
function bindPager(container, onPage){

function updateHash(params){

  Object.entries(params).forEach(([k,v]) => { if (v) qs.set(k,v); });
  const base = location.hash.split('?')[0];
  const newHash = qs.toString() ? `${base}?${qs}` : base;
  history.replaceState(null, '', newHash);
  route();
}

        ${article.tags.map(t => cveTags.includes(t)
          ? `<a href="#/vulnerabilities/${esc(t)}" class="chip accent">${esc(t)}</a>`

        <form id="commentForm" style="margin-bottom:16px">
          <div class="field"><input required placeholder="Your name" id="cName" value="${esc(State.user?.name||'')}"></div>
          <div class="field"><textarea required placeholder="Share your thoughts..."></textarea></div>
          <button class="btn btn-primary btn-sm" type="submit">Post comment</button>
        </form>
        <div id="commentList">
          ${comments.length ? comments.map(c => `
            <div class="comment" data-comment="${esc(c.id)}">
              <div class="comment-head"><strong>${esc(c.authorName||'Anonymous')}</strong><span>${esc(relTime(c.createdAt))}</span></div>

    route();
  }));
});

  view.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', async () => {
    const s = await DB.get('sources', b.dataset.toggle);
    if (!s) return;
    s.status = s.status === 'active' ? 'disabled' : 'active';
    await DB.put('sources', s);
    await audit('source.toggle','source',s.id,{status:s.status});
    route();

function openSourceModal(existing, onSave){
  const isEdit = !!existing;
  const m = openModal({ title: isEdit?'Edit source':'Add source',
    body:`
      <div class="field"><label>Name</label><input id="sName" value="${esc(existing?.name||'')}"></div>
      <div class="field"><label>Feed URL (RSS / Atom)</label><input id="sUrl" value="${esc(existing?.feedUrl||'')}" placeholder="https://example.com/feed/"></div>
      <div class="field"><label>Category</label><input id="sCat" value="${esc(existing?.category||'news')}"></div>
      <div class="field"><label>Interval (min)</label><input id="sInt" type="number" min="5" value="${existing?.intervalMin||30}"></div>
    `,
    footer:`<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="sSave">Save</button>` });
  m.el.querySelector('#sSave').addEventListener('click', async () => {
    const name = m.el.querySelector('#sName').value.trim();
    const url = m.el.querySelector('#sUrl').value.trim();
    if (!name || !url) { toast('error','Missing fields','Name and URL required.'); return; }
    if (isEdit) {
      await DB.put('sources', { ...existing, name, feedUrl: url,
        category: m.el.querySelector('#sCat').value.trim()||'news',
        intervalMin: parseInt(m.el.querySelector('#sInt').value,10)||30, updatedAt: Date.now() });
      await audit('source.update','source',existing.id);
    } else {
      await DB.put('sources', { id: uid(), name, feedUrl: url, type: 'rss',
        category: m.el.querySelector('#sCat').value.trim()||'news',
        intervalMin: parseInt(m.el.querySelector('#sInt').value,10)||30,
        status: 'active', itemsFetched: 0, itemsPublished: 0, duplicates: 0,
        createdAt: Date.now(), updatedAt: Date.now() });
      await audit('source.create','source',null,{name});
    }
    m.close(); toast('ok','Saved',''); onSave?.();
  });
}

route(p => p.startsWith('/search'), async (_, view) => {
  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  const q = params.get('q') || '';
  let results = { articles: [], cves: [], incidents: [] };
  if (q) {
    track('search', q);
    const lower = q.toLowerCase();
    results.articles = (await DB.all('articles')).filter(a => (a.title+' '+(a.excerpt||'')+' '+(a.tags||[]).join(' ')).toLowerCase().includes(lower)).slice(0,20);
    results.cves = (await DB.all('cves')).filter(c => (c.cveId+' '+(c.description||'')+' '+(c.vendor||'')+' '+(c.product||'')).toLowerCase().includes(lower)).slice(0,20);
    results.incidents = (await DB.all('incidents')).filter(i => (i.title+' '+(i.summary||'')).toLowerCase().includes(lower)).slice(0,20);
  }
  view.innerHTML = `
    <div class="section-head"><h1 class="section-title" style="font-size:1.3rem">Search</h1></div>
    <div class="filters">
      <input type="search" id="sq" placeholder="Search articles, CVEs, incidents..." value="${esc(q)}" autofocus>
      <button class="btn btn-sm" id="goBtn">Search</button>
    </div>
    ${!q ? '<p class="text-3 small">Type keywords to search across all local data.</p>' : `
      <p class="small text-3 mb-3">${results.articles.length + results.cves.length + results.incidents.length} results for "${esc(q)}"</p>
      ${results.articles.length ? `<div class="section-head"><h2 class="section-title">Articles (${results.articles.length})</h2></div><div class="card-grid">${results.articles.map(articleCard).join('')}</div>` : ''}
      ${results.cves.length ? `<div class="section-head"><h2 class="section-title">CVEs (${results.cves.length})</h2></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>CVE</th><th>Severity</th><th>CVSS</th><th>Vendor</th><th>Product</th><th>Published</th></tr></thead><tbody>${results.cves.map(cveRow).join('')}</tbody></table></div>` : ''}
      ${results.incidents.length ? `<div class="section-head"><h2 class="section-title">Incidents (${results.incidents.length})</h2></div><div class="card-grid">${results.incidents.map(i => `<div class="article-card" style="padding:14px"><strong>${esc(i.title)}</strong><p class="small text-3 mt-2">${esc(i.summary||'')}</p></div>`).join('')}</div>` : ''}
      ${!results.articles.length && !results.cves.length && !results.incidents.length ? emptyState('No results','Try different keywords.') : ''}
    `}
  `;
  const doSearch = () => {
    const v = view.querySelector('#sq').value.trim();
    updateHash({ q: v });
  };
  view.querySelector('#sq')?.addEventListener('input', debounce(doSearch, 350));
  view.querySelector('#goBtn')?.addEventListener('click', doSearch);
});

route(p => p === '/admin', async (_, view) => {
  if (!State.user) { renderLogin(view); return; }
  const articles = await DB.all('articles');

  const sources = await DB.all('sources');
  const comments = await DB.all('comments');
  const logs = await DB.all('syncLogs');
  const auditLogs = await DB.all('audit');
  const analytics = await DB.all('analytics');

  const drafts = articles.filter(a => a.status === 'draft');

  const pending = comments.filter(c => c.status === 'pending');
  const kevCount = cves.filter(c => c.kev).length;
  const viewCount = analytics.filter(v => v.type === 'view').length;

  view.innerHTML = `

      <h1 class="section-title" style="font-size:1.3rem">Admin Dashboard</h1>
      <div class="flex gap-2">
        <span class="chip accent">${esc(State.user.name || State.user.email)} · ${esc(State.user.role)}</span>

      </div>

    <div class="stat-grid">

      <div class="stat-card"><div class="stat-label">CVEs</div><div class="stat-value">${cves.length}</div><div class="stat-hint">${kevCount} KEV</div></div>
      <div class="stat-card"><div class="stat-label">Sources</div><div class="stat-value">${sources.length}</div><div class="stat-hint">${failed.length} failed</div></div>
      <div class="stat-card"><div class="stat-label">Comments</div><div class="stat-value">${comments.length}</div><div class="stat-hint">${pending.length} pending</div></div>
      <div class="stat-card"><div class="stat-label">Views</div><div class="stat-value">${viewCount}</div><div class="stat-hint">tracked locally</div></div>
    </div>
    <div class="tabs mt-4" id="adminTabs">
      <button class="tab active" data-tab="articles">Articles</button>
      <button class="tab" data-tab="moderation">Moderation (${pending.length})</button>
      <button class="tab" data-tab="logs">Ingestion log (${logs.length})</button>

      <button class="tab" data-tab="system">System</button>
    </div>
    <div id="panel" class="mt-3"></div>
  `;

  const tabs = view.querySelectorAll('#adminTabs .tab');
  const render = name => {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === name));

  };

  render('articles');

});

function renderArticles(panel){
  panel.innerHTML = `
    <div class="flex between center mb-3">
      <h3 style="font-size:.95rem">Article management</h3>
      <button class="btn btn-sm btn-primary" id="newBtn">+ New article</button>

  `;
  panel.querySelector('#newBtn').addEventListener('click', () => openArticleEditor(null, () => refresh()));
  async function refresh(){
    const list = (await DB.all('articles')).sort((a,b)=>(b.publishedAt||b.createdAt||0)-(a.publishedAt||a.createdAt||0));
    const host = panel.querySelector('#list');
    if (!list.length) { host.innerHTML = emptyState('No articles','Ingest from sources or create manually.', null, null); return; }
    host.innerHTML = `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Title</th><th>Status</th><th>Category</th><th>Source</th><th>Views</th><th>Published</th><th></th></tr></thead>

        <td>${a.isBreaking ? '<span class="chip" style="background:var(--danger);color:#fff">BRK</span> ' : ''}<span class="chip">${esc(a.status)}</span></td>
        <td>${esc(a.category||'—')}</td>
        <td>${esc(a.sourceName||'—')}</td>
        <td class="mono">${a.views||0}</td>
        <td>${esc(fmtDate(a.publishedAt))}</td>
        <td>
          <button class="btn btn-sm" data-edit="${esc(a.id)}">Edit</button>
          <button class="btn btn-sm" data-break="${esc(a.id)}">${a.isBreaking?'Unmark':'Break'}</button>
          <button class="btn btn-sm btn-danger" data-del="${esc(a.id)}">✕</button>
        </td>
      </tr>`).join('')}</tbody>
    </table></div>`;
    host.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', async () => {
      const rec = await DB.get('articles', b.dataset.edit);
      if (rec) openArticleEditor(rec, refresh);
    }));
    host.querySelectorAll('[data-break]').forEach(b => b.addEventListener('click', async () => {
      const rec = await DB.get('articles', b.dataset.break);
      if (!rec) return;
      rec.isBreaking = !rec.isBreaking;
      if (rec.isBreaking) rec.breakingUntil = Date.now() + 24*3600*1000;
      await DB.put('articles', rec);
      await audit('article.break','article',rec.id,{isBreaking:rec.isBreaking});
      refreshBreaking();
      refresh();
    }));
    host.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => confirmDialog('Delete this article?', async () => {
      await DB.del('articles', b.dataset.del);
      await audit('article.delete','article',b.dataset.del);
      toast('ok','Deleted','');
      refresh();
    })));
  }
  refresh();

  const active = sources.filter(s => s.status === 'active').length;
  panel.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Database</div><div class="stat-value" style="font-size:.95rem"><span class="health-dot health-ok"></span>IndexedDB operational</div></div>
      <div class="stat-card"><div class="stat-label">Sources</div><div class="stat-value">${active}</div><div class="stat-hint">${failed} failed</div></div>
      <div class="stat-card"><div class="stat-label">KEV sync</div><div class="stat-value" style="font-size:.95rem" id="kevTime">—</div></div>
      <div class="stat-card"><div class="stat-label">Version</div><div class="stat-value" style="font-size:.95rem">v${CONFIG.version}</div></div>
    </div>
    <h3 style="font-size:.95rem;margin:20px 0 10px">Danger zone</h3>
    <div class="flex gap-2 wrap">
      <button class="btn btn-sm" id="exportBtn">Export data (JSON)</button>
      <button class="btn btn-sm btn-danger" id="resetBtn">Reset database</button>
    </div>
  `;
  DB.meta('kevLastSync').then(v => { const el = panel.querySelector('#kevTime'); if (el) el.textContent = v ? relTime(v) : 'Never'; });
  panel.querySelector('#exportBtn').addEventListener('click', async () => {
    const dump = {};
    for (const st of ['articles','cves','incidents','sources','syncLogs','comments','live','audit']) dump[st] = await DB.all(st);
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'cyberintel-backup-' + Date.now() + '.json'; a.click();
    URL.revokeObjectURL(url);
    await audit('data.export','system','all');
  });
  panel.querySelector('#resetBtn').addEventListener('click', () => confirmDialog('Delete all local data? This cannot be undone.', async () => {
    for (const st of ['articles','cves','incidents','sources','syncLogs','comments','live','audit','analytics']) await DB.clear(st);
    toast('ok','Reset','All data removed.');
    route();
  }));
}

/* ---------- 21. GLOBAL SEARCH MODAL ---------- */
$('#searchBtn').addEventListener('click', () => {
  const m = openModal({ title:'Search',
    body:`<div class="field"><input id="gmQ" placeholder="Search everything..." autofocus></div>`,
    footer:`<button class="btn btn-primary" id="gmGo">Search</button>` });
  const input = m.el.querySelector('#gmQ');
  input.focus();
  const go = () => {
    const q = input.value.trim();
    m.close();
    if (q) location.hash = '#/search?q=' + encodeURIComponent(q);
  };
  m.el.querySelector('#gmGo').addEventListener('click', go);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
});

/* ---------- 22. KEYBOARD ---------- */
document.addEventListener('keydown', e => {
  if (e.key === '/' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) {
    e.preventDefault(); $('#searchBtn').click();
  }
  if (e.key === 'Escape') $$('.modal-backdrop').forEach(m => m.remove());
});

/* ---------- 25. AUTO-INGEST ---------- */
let ingestTimer = null;
function scheduleIngest(){
  if (ingestTimer) clearInterval(ingestTimer);
  ingestTimer = setInterval(() => {
    if (document.visibilityState === 'visible' && !PIPELINE_RUNNING) {
      runPipeline().then(() => { refreshBreaking(); refreshStatusMeta(); }).catch(()=>{});
    }
  }, 15 * 60 * 1000);
}

/* ---------- 26. INIT ---------- */
async function init(){
  // theme + lang
  const savedTheme = localStorage.getItem('ci_theme') || 'dark';
  setTheme(savedTheme);
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  $('#langLabel').textContent = currentLang === 'ar' ? 'EN' : 'AR';
  $('#footerAbout').textContent = I18N[currentLang].footerAbout;
  $('#year').textContent = new Date().getFullYear();
  $('#versionLabel').textContent = 'v' + CONFIG.version;

  // DB
  try {
    await DB.init();
    console.log('[CyberIntel] DB ready');
  } catch (e) {
    console.error('DB init failed', e);
    $('#view').innerHTML = `<div class="empty"><h3>Database initialization failed</h3><p>${esc(e.message)}</p>
      <p class="tiny text-3 mt-2">If you opened the file directly (file://), switch to running via http://localhost. IndexedDB & crypto.subtle require a proper origin.</p>
      <button class="btn btn-primary mt-3" onclick="location.reload()">Reload</button></div>`;
    return;
  }

  // seed sources if empty
  try {
    const sc = await DB.count('sources');
    if (sc === 0) {
      await seedSources();
      console.log('[CyberIntel] sources seeded');
    }
  } catch(e){ console.warn('seed failed', e); }

  // register hashchange
  window.addEventListener('hashchange', route);

  // initial render
  await route();
  await refreshBreaking();
  await refreshStatusMeta();

  // auto KEV if none and never synced
  try {
    const kevRecs = (await DB.all('cves')).filter(c => c.kev);
    const kevSync = await DB.meta('kevLastSync');
    if (!kevRecs.length && !kevSync) {
      syncKev().then(() => { refreshStatusMeta(); if (location.hash === '#/' || location.hash === '') route(); }).catch(e => console.warn('KEV sync failed:', e.message));
    }
  } catch(e){ console.warn('kev check failed', e); }

  // if articles empty and sources exist, trigger first ingest automatically
  try {
    const ac = await DB.count('articles');
    const sc = await DB.count('sources');
    if (ac === 0 && sc > 0) {
      toast('warn','First-time setup','Fetching initial articles from sources...');
      runPipeline().then(() => { refreshBreaking(); route(); }).catch(()=>{});
    }
  } catch(e){ console.warn('auto-ingest failed', e); }

  scheduleIngest();
  setInterval(() => refreshBreaking().catch(()=>{}), 60000);

  window.addEventListener('online', () => toast('ok','Back online',''));
  window.addEventListener('offline', () => toast('warn','Offline','Some integrations may fail.'));

  console.log('[CyberIntel] ready ✓');
}

init().catch(err => {
  console.error('[CyberIntel] fatal', err);
  $('#view').innerHTML = `<div class="empty"><h3>Initialization error</h3><p>${esc(err.message)}</p>
    <button class="btn btn-primary mt-3" onclick="location.reload()">Reload</button></div>`;
});
</script>
